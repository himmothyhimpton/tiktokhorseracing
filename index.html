<!DOCTYPE html>
<html>
<head>
    <title>FACESHOT-CHOPSHOP GLOBAL DERBY</title>
    <style>
        body { background: #000; color: #fff; font-family: 'Arial Black', sans-serif; text-align: center; margin: 0; padding: 20px; }
        .lane { width: 95%; height: 90px; border-bottom: 3px solid #333; margin: 10px auto; position: relative; background: #0a0a0a; display: flex; align-items: center; }
        .horse { font-size: 60px; position: absolute; left: 0; transition: left 0.2s cubic-bezier(0.18, 0.89, 0.32, 1.28); z-index: 2; }
        .finish { position: absolute; right: 0; width: 30px; height: 100%; background: repeating-linear-gradient(0deg, #fff 0, #fff 10px, #000 10px, #000 20px); border-left: 5px solid #ff0000; }
        h1 { color: #ff0000; text-transform: uppercase; font-size: 50px; letter-spacing: 2px; margin-bottom: 10px; text-shadow: 3px 3px #fff; }
        p { font-size: 24px; color: #ffcc00; font-weight: bold; }
        #winner-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; justify-content: center; align-items: center; flex-direction: column; }
        #winner-overlay h2 { font-size: 80px; color: #ff0000; text-shadow: 4px 4px #fff; }
    </style>
</head>
<body>
    <div id="winner-overlay"><h2 id="winner-text"></h2><p>PREPARING NEXT RACE...</p></div>
    
    <h1>FACESHOT-CHOPSHOP GLOBAL DERBY</h1>
    <p>SEND GIFTS TO BOOST YOUR SQUAD!</p>

    <div class="lane"><div id="h1" class="horse">🇲🇽🐎</div><div class="finish"></div></div>
    <div class="lane"><div id="h2" class="horse">🇺🇸🐎</div><div class="finish"></div></div>
    <div class="lane"><div id="h3" class="horse">🇧🇷🐎</div><div class="finish"></div></div>
    <div class="lane"><div id="h4" class="horse">🇨🇦🐎</div><div class="finish"></div></div>
    <div class="lane"><div id="h5" class="horse">🇬🇧🐎</div><div class="finish"></div></div>

    <script>
        const winnerOverlay = document.getElementById('winner-overlay');
        const winnerText = document.getElementById('winner-text');
        let racing = true;

        const move = (id, country) => {
            if (!racing) return;
            const el = document.getElementById(id);
            let pos = parseInt(el.style.left) || 0;
            pos += 35; 
            const finishLine = window.innerWidth * 0.85;
            
            if (pos >= finishLine) {
                racing = false;
                el.style.left = finishLine + 'px';
                winnerText.innerText = country + " WINS!";
                winnerOverlay.style.display = 'flex';
                setTimeout(() => { location.reload(); }, 5000); // 5 sec pause before reset
            } else {
                el.style.left = pos + 'px';
            }
        };

        window.addEventListener('keydown', (e) => {
            if (e.key === '1') move('h1', 'MEXICO');
            if (e.key === '2') move('h2', 'USA');
            if (e.key === '3') move('h3', 'BRAZIL');
            if (e.key === '4') move('h4', 'CANADA');
            if (e.key === '5') move('h5', 'UK');
        });
    </script>
</body>
</html>
