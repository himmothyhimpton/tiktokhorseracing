<!DOCTYPE html>
<html>
<head>
    <title>FACESHOT-CHOPSHOP GLOBAL DERBY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: 'Arial Black', sans-serif; text-align: center; padding: 10px; overflow: hidden; user-select: none; }
        h1 { color: #ff2222; font-size: 38px; text-transform: uppercase; text-shadow: 3px 3px 0 #fff2; margin-bottom: 5px; line-height: 1; }
        #track { width: 100%; }
        .lane { width: 100%; height: 85px; margin: 5px 0; position: relative; background: #0a0a0a; border: 2px solid #1c1c1c; border-radius: 8px; display: flex; align-items: center; overflow: hidden; }
        
        /* SIDEBAR WITH GIFT ICONS */
        .gift-guide { width: 75px; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 2px solid #222; background: #111; z-index: 5; }
        .gift-guide img { width: 45px; height: 45px; object-fit: contain; filter: drop-shadow(0 0 5px #ffcc00); }
        .gift-label { font-size: 10px; color: #ffcc00; margin-top: 2px; letter-spacing: 1px; }

        .racer { position: absolute; left: 85px; display: flex; align-items: center; transition: left 0.3s ease-out; z-index: 3; }
        .stripe { width: 10px; height: 55px; border-radius: 3px; display: flex; flex-direction: column; margin-right: 10px; }
        .stripe span { flex: 1; }
        .horse { font-size: 65px; transform: scaleX(-1); } 
        
        /* COUNTRY COLORED LABELS */
        .namelabel { 
            position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); 
            font-size: 28px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; 
            z-index: 1; opacity: 0.4; white-space: nowrap;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }

        .finish { position: absolute; right: 0; width: 35px; height: 100%; background: repeating-linear-gradient(180deg, #fff 0, #fff 10px, #000 10px, #000 20px); border-left: 5px solid #ff0000; z-index: 4; }
        #bottom { display: flex; gap: 10px; margin-top: 15px; }
        .panel { background: #0d0d0d; border: 2px solid #1c1c1c; border-radius: 10px; padding: 12px; flex: 1; text-align: left; }
        .panel h2 { font-size: 13px; color: #ff2222; text-transform: uppercase; border-bottom: 1px solid #1c1c1c; padding-bottom: 4px; margin-bottom: 6px; }
        #last-winner-name { font-size: 30px; color: #ffcc00; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        #overlay.on { display: flex; }
    </style>
</head>
<body>

<div id="overlay">
    <div id="win-text" style="font-size:90px; color:#ffcc00; font-weight:900;">WINNER!</div>
    <div style="font-size:30px">🏆 GLOBAL DERBY CHAMPION 🏆</div>
</div>

<h1>🏁 FACESHOT-CHOPSHOP GLOBAL DERBY 🏁</h1>
<div id="track"></div>

<div id="bottom">
    <div class="panel"><h2>🏆 Last Winner</h2><div id="last-winner-name">—</div></div>
    <div class="panel" style="flex:1.5"><h2>🚀 Newbie Guide</h2><div style="font-size:15px; color:#aaa;">Gifts = <b style="color:#ffcc00">MASSIVE BOOST!</b> | Horses move slowly on their own!</div></div>
</div>

<script>
// Using hosted images so you don't have to upload anything
const HORSES = [
    { id:'h1', key:'1', name:'MEXICO',  img:'https://thenounproject.com', colors:['#006847','#fff','#ce1126'] }, // Rose-like
    { id:'h2', key:'2', name:'USA',     img:'https://thenounproject.com', colors:['#B22234','#fff','#3C3B6E'] }, // Heart-like
    { id:'h3', key:'3', name:'BRAZIL',  img:'https://thenounproject.com', colors:['#009c3b','#FFDF00','#002776'] }, // Cat-like
    { id:'h4', key:'4', name:'CANADA',  img:'https://thenounproject.com', colors:['#ff0000','#fff','#ff0000'] }, // Cookie-like
    { id:'h5', key:'5', name:'UK',      img:'https://thenounproject.com', colors:['#012169','#C8102E','#fff'] }  // Pink Heart-like
];

const track = document.getElementById('track');
let racing = true;

HORSES.forEach(h => {
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `
        <div class="gift-guide">
            <img src="${h.img}">
            <div class="gift-label">BOOST</div>
        </div>
        <div class="namelabel" style="background-image:linear-gradient(90deg,${h.colors.join(',')})">${h.name}</div>
        <div id="${h.id}" class="racer" style="left:85px;">
            <div class="stripe">${h.colors.map(c => `<span style="background:${c}"></span>`).join('')}</div>
            <div class="horse">🐎</div>
        </div>
        <div class="finish"></div>`;
    track.appendChild(lane);
});

const move = (id, country, amount) => {
    if (!racing) return;
    const el = document.getElementById(id);
    let pos = parseFloat(el.style.left) || 85;
    pos += amount; 
    el.style.left = pos + 'px';
    if (pos >= window.innerWidth * 0.85) {
        racing = false;
        showWinner(country);
    }
};

// AUTO-CREEP (Screen activity)
setInterval(() => {
    if (racing) {
        const hIdx = Math.floor(Math.random() * 5);
        move(HORSES[hIdx].id, HORSES[hIdx].name, 3); 
    }
}, 1400);

function showWinner(country) {
    document.getElementById('win-text').innerText = country + " WINS!";
    document.getElementById('last-winner-name').innerText = country;
    document.getElementById('overlay').classList.add('on');
    setTimeout(() => { location.reload(); }, 6000);
}

window.addEventListener('keydown', (e) => {
    const h = HORSES.find(x => x.key === e.key);
    if (h) move(h.id, h.name, 50); 
});
</script>
</body>
</html>
