<!DOCTYPE html>
<html>
<head>
    <title>FACESHOT-CHOPSHOP GLOBAL DERBY</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #000; color: #fff; font-family: 'Arial Black', sans-serif; text-align: center; padding: 10px; overflow: hidden; user-select: none; }
        h1 { color: #ff2222; font-size: 38px; text-transform: uppercase; text-shadow: 3px 3px 0 #fff2; margin-bottom: 5px; }
        #main-container { display: flex; gap: 10px; width: 100%; height: 460px; }
        #track { flex: 4; }
        .lane { width: 100%; height: 85px; margin: 6px 0; position: relative; background: #0a0a0a; border: 2px solid #1c1c1c; border-radius: 8px; display: flex; align-items: center; overflow: hidden; }
        .racer { position: absolute; left: 10px; display: flex; align-items: center; transition: left 0.3s ease-out; z-index: 3; }
        .stripe { width: 10px; height: 55px; border-radius: 3px; display: flex; flex-direction: column; margin-right: 10px; }
        .stripe span { flex: 1; }
        .horse { font-size: 65px; transform: scaleX(-1); } 
        .namelabel { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 32px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; z-index: 1; opacity: 0.45; white-space: nowrap; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .finish { position: absolute; right: 0; width: 35px; height: 100%; background: repeating-linear-gradient(180deg, #fff 0, #fff 10px, #000 10px, #000 20px); border-left: 5px solid #ff0000; z-index: 4; }
        #sidebar { flex: 1; background: #0d0d0d; border: 2px solid #1c1c1c; border-radius: 8px; display: flex; flex-direction: column; justify-content: space-around; padding: 10px 5px; }
        .guide-item { display: flex; align-items: center; gap: 8px; text-align: left; border-bottom: 1px solid #222; padding-bottom: 5px; }
        .guide-item:last-child { border-bottom: none; }
        .guide-emoji { font-size: 32px; }
        .guide-text { font-size: 11px; line-height: 1.1; }
        .guide-text b { color: #ffcc00; display: block; font-size: 13px; }
        #bottom { display: flex; gap: 10px; margin-top: 15px; width: 100%; }
        .panel { background: #0d0d0d; border: 2px solid #1c1c1c; border-radius: 8px; padding: 12px; flex: 1; text-align: left; }
        .panel h2 { font-size: 13px; color: #ff2222; text-transform: uppercase; border-bottom: 1px solid #1c1c1c; padding-bottom: 4px; margin-bottom: 6px; }
        #last-winner-name { font-size: 30px; color: #ffcc00; }
        #overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.98); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        #overlay.on { display: flex; }
    </style>
</head>
<body>
<div id="overlay"><div id="win-text" style="font-size:90px; color:#ffcc00; font-weight:900;">WINNER!</div><div style="font-size:30px">🏆 GLOBAL DERBY CHAMPION 🏆</div></div>
<h1>🏁 FACESHOT-CHOPSHOP GLOBAL DERBY 🏁</h1>
<div id="main-container">
    <div id="track"></div>
    <div id="sidebar">
        <div class="guide-item"><span class="guide-emoji">🌹</span><div class="guide-text"><b>MEXICO</b>Rose</div></div>
        <div class="guide-item"><span class="guide-emoji">🤍</span><div class="guide-text"><b>USA</b>White Heart</div></div>
        <div class="guide-item"><span class="guide-emoji">🐱</span><div class="guide-text"><b>BRAZIL</b>Cat</div></div>
        <div class="guide-item"><span class="guide-emoji">😍</span><div class="guide-text"><b>CANADA</b>Heart Eyes</div></div>
        <div class="guide-item"><span class="guide-emoji">💖</span><div class="guide-text"><b>UK</b>Pink Heart</div></div>
    </div>
</div>
<div id="bottom">
    <div class="panel"><h2>🏆 Last Winner</h2><div id="last-winner-name">—</div></div>
    <div class="panel" style="flex:1.5"><h2>🚀 HYPE</h2><div style="font-size:16px; color:#ffcc00;">GIFTS = MASSIVE BOOST! | Horses creep slowly on their own!</div></div>
</div>
<script>
const HORSES = [
    { id:'h1', key:'1', name:'MEXICO',  colors:['#006847','#fff','#ce1126'] },
    { id:'h2', key:'2', name:'USA',     colors:['#B22234','#fff','#3C3B6E'] },
    { id:'h3', key:'3', name:'BRAZIL',  colors:['#009c3b','#FFDF00','#002776'] },
    { id:'h4', key:'4', name:'CANADA',  colors:['#ff0000','#fff','#ff0000'] },
    { id:'h5', key:'5', name:'UK',      colors:['#012169','#C8102E','#fff'] }
];
const track = document.getElementById('track');
let racing = true;
HORSES.forEach(h => {
    const lane = document.createElement('div');
    lane.className = 'lane';
    lane.innerHTML = `<div class="namelabel" style="background-image:linear-gradient(90deg,${h.colors.join(',')})">${h.name}</div><div id="${h.id}" class="racer" style="left:10px;"><div class="stripe">${h.colors.map(c => `<span style="background:${c}"></span>`).join('')}</div><div class="horse">🐎</div></div><div class="finish"></div>`;
    track.appendChild(lane);
});
const move = (id, country, amount) => {
    if (!racing) return;
    const el = document.getElementById(id);
    let pos = parseFloat(el.style.left) || 10;
    pos += amount; 
    el.style.left = pos + 'px';
    if (pos >= (track.offsetWidth - 45)) { racing = false; showWinner(country); }
};
setInterval(() => { if (racing) { const hIdx = Math.floor(Math.random() * 5); move(HORSES[hIdx].id, HORSES[hIdx].name, 3); } }, 1300);
function showWinner(country) { document.getElementById('win-text').innerText = country + " WINS!"; document.getElementById('last-winner-name').innerText = country; document.getElementById('overlay').classList.add('on'); setTimeout(() => { location.reload(); }, 6000); }
window.addEventListener('keydown', (e) => { const h = HORSES.find(x => x.key === e.key); if (h) move(h.id, h.name, 45); });
</script>
</body>
</html>
